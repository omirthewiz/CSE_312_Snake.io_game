server {
    listen 80;

    # auth requests go to the auth server, never the app
    location /register { proxy_pass http://auth:3001; }
    location /login    { proxy_pass http://auth:3001; }
    location /logout   { proxy_pass http://auth:3001; }

    # websocket upgrade must be forwarded for the game connection
    location /ws {
        proxy_pass http://app:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }

    # everything else -> the app
    location / {
        proxy_pass http://app:3000;
    }
}
